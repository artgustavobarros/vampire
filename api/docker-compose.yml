name: vampire

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vampire
      POSTGRES_PASSWORD: vampire
      POSTGRES_DB: vampire
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vampire -d vampire"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3333
      DATABASE_URL: postgres://vampire:vampire@db:5432/vampire
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-isto-antes-de-usar-de-verdade}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${PORT:-3333}:3333"

volumes:
  pgdata:
