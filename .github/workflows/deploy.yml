# Deploy no VPS Hostinger a cada push na main. A action não constrói nada aqui:
# ela pede à Hostinger que o VPS clone este commit e suba o docker-compose.prod.yml.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conferir secrets e variables
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          APP_HOST: ${{ vars.APP_HOST }}
        run: |
          missing=0
          for name in HOSTINGER_API_KEY JWT_SECRET POSTGRES_PASSWORD HOSTINGER_VM_ID APP_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta $name (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          # os dois segredos entram numa linha de shell da action e na DATABASE_URL
          for name in JWT_SECRET POSTGRES_PASSWORD; do
            if [ -n "${!name}" ] && ! [[ "${!name}" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "::error::$name deve ter só letras e números (use: openssl rand -hex 32)"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy no VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: vampire
          docker-compose-path: docker-compose.prod.yml
          environment-variables: |
            APP_HOST=${{ vars.APP_HOST }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
