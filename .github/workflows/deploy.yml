# Deploy no VPS Hostinger a cada push na main, depois do CI passar. A action não
# constrói nada aqui: ela pede à Hostinger que o VPS clone este commit e suba o
# docker-compose.prod.yml.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conferir secrets e variables
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          APP_HOST: ${{ vars.APP_HOST }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: |
          missing=0
          for name in HOSTINGER_API_KEY JWT_SECRET POSTGRES_PASSWORD ADMIN_PASSWORD HOSTINGER_VM_ID APP_HOST ADMIN_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta $name (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          # os dois segredos entram numa linha de shell da action e na DATABASE_URL
          for name in JWT_SECRET POSTGRES_PASSWORD; do
            if [ -n "${!name}" ] && ! [[ "${!name}" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "::error::$name deve ter só letras e números (use: openssl rand -hex 32)"
              missing=1
            fi
          done
          # sem aspas, $, crase, barra invertida nem espaço: quebrariam o shell da action ou o .env do VPS
          safe='^[A-Za-z0-9!@#%^&*()_+=.,:;?/~-]{8,}$'
          if [ -n "$ADMIN_PASSWORD" ] && ! [[ "$ADMIN_PASSWORD" =~ $safe ]]; then
            echo "::error::ADMIN_PASSWORD precisa de 8+ caracteres, só letras, números e !@#%^&*()_+=.,:;?/~-"
            missing=1
          fi
          exit $missing

      - name: Deploy no VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: vampire
          docker-compose-path: docker-compose.prod.yml
          environment-variables: |
            APP_HOST=${{ vars.APP_HOST }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
